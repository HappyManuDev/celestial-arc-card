version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (peer: <6.1.0).
      # Remove this once a typescript-eslint release accepts TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
