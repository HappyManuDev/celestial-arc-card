name: HACS validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS action
    runs-on: ubuntu-latest
    steps:
      # Left on main on purpose: HACS documents it this way, the last tagged
      # release dates from 2022, and main runs the checks hacs/default applies today.
      - uses: hacs/action@main
        with:
          category: plugin
